<section class="stats">
    <div class="stat-card">
        <div class="stat-icon">⏱</div>
        <div class="stat-label">Uptime</div>
        <div class="stat-value" id="uptimeVal">0s</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📡</div>
        <div class="stat-label">Requests Sent</div>
        <div class="stat-value" id="reqVal">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">⚡</div>
        <div class="stat-label">Requests / Sec</div>
        <div class="stat-value" id="rpsVal">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">🔄</div>
        <div class="stat-label">Cycle Restarts</div>
        <div class="stat-value" id="restartVal">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">🌐</div>
        <div class="stat-label">Proxies Loaded</div>
        <div class="stat-value" id="proxyCountVal">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">🛰</div>
        <div class="stat-label">Proxy Status</div>
        <div class="stat-value" id="proxyStatusVal">—</div>
    </div>
    <div class="stat-card error">
        <div class="stat-icon">⚠</div>
        <div class="stat-label">Errors</div>
        <div class="stat-value" id="errVal">0</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">🎯</div>
        <div class="stat-label">Status</div>
        <div class="stat-value" id="runVal">—</div>
    </div>
</section>
